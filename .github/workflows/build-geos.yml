name: Build Debian 12 PHP 8.2 GEOS backport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
    steps:
      - name: Install build tools in disposable Debian 12 container
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential devscripts dpkg-dev debhelper dh-php \
            libgeos-dev php8.2-cli php8.2-dev php-dev phpunit
          php8.2 -v
          php-config8.2 --extension-dir

      - name: Download official Debian GEOS source and create versioned Bookworm backport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geos-build
          cd /tmp/geos-build
          dget -u https://deb.debian.org/debian/pool/main/p/php-geos/php-geos_1.0.0-8.dsc
          cd php-geos-1.0.0
          export DEBEMAIL='build@example.invalid' DEBFULLNAME='Local Debian Backport'
          dch --newversion '1.0.0-8~bpo12+1' --distribution bookworm --force-distribution \
            'Rebuild official Debian GEOS 1.0.0-8 for Debian 12 and PHP 8.2.'
          head -n 10 debian/changelog
          dpkg-buildpackage -us -uc -b
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp ../php-geos_1.0.0-8~bpo12+1_amd64.deb "$GITHUB_WORKSPACE/output/"
          dpkg-deb -I "$GITHUB_WORKSPACE"/output/*.deb
          dpkg-deb -c "$GITHUB_WORKSPACE"/output/*.deb
          dpkg --compare-versions '1.0.0-7+b1' lt '1.0.0-8~bpo12+1'
          dpkg --compare-versions '1.0.0-8~bpo12+1' lt '1.0.0-8'
          # Standard Debian package, not the earlier /opt/MJH sidecar.
          test "$(dpkg-deb -f "$GITHUB_WORKSPACE"/output/*.deb Package)" = php-geos
          dpkg-deb -c "$GITHUB_WORKSPACE"/output/*.deb | grep 'usr/lib/php/20220829/geos.so'

      - name: Test ordinary Debian package upgrade and PHP 8.2 GEOS
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends php-geos
          dpkg-query -W -f='${Version}' php-geos | grep '^1.0.0-7'
          dpkg -i "$GITHUB_WORKSPACE"/output/*.deb
          dpkg-query -W -f='${Version}' php-geos | grep -Fx '1.0.0-8~bpo12+1'
          php8.2 -n -d extension=geos.so -r 'if (!extension_loaded("geos") || !class_exists("GEOSGeometry")) exit(1); $r = new GEOSWKTReader(); $g = $r->read("POINT (7 49)"); if (!$g instanceof GEOSGeometry) exit(1); echo "GEOS PHP 8.2 WKT OK",PHP_EOL;'
          php8.2 -m | grep -x geos
          dpkg --audit
          echo 'Ordinary Debian php-geos upgrade and PHP 8.2 tests completed.'

      - name: Upload versioned Debian 12 backport package
        uses: actions/upload-artifact@v4
        with:
          name: php-geos-bookworm-backport
          path: output/*.deb
          if-no-files-found: error
          retention-days: 14
