name: Build PHP-GEOS for Debian 12 / PHP 8.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
    steps:
      - name: Install build dependencies in disposable Debian 12 container
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential devscripts dpkg-dev debhelper dh-php \
            libgeos-dev php8.2-cli php8.2-dev php-dev phpunit
          php8.2 -v
          php-config8.2 --extension-dir

      - name: Download official Debian 1.0.0-8 source and build for Bookworm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geos-build
          cd /tmp/geos-build
          dget -u https://deb.debian.org/debian/pool/main/p/php-geos/php-geos_1.0.0-8.dsc
          cd php-geos-1.0.0
          dpkg-buildpackage -us -uc -b
          # Create a standalone package. Never replace the existing php-geos package:
          # it owns the PHP 7.4 configuration on the production server.
          mkdir -p "$GITHUB_WORKSPACE/output"
          pkgroot=/tmp/mjh-geos-package
          mkdir -p "$pkgroot/DEBIAN" "$pkgroot/opt/mjh/php-geos-8.2"
          install -m 0644 modules/geos.so "$pkgroot/opt/mjh/php-geos-8.2/geos.so"
          cat > "$pkgroot/DEBIAN/control" <<'CONTROL'
          Package: mjh-php82-geos
          Version: 1.0.0-8+bookworm1
          Section: php
          Priority: optional
          Architecture: amd64
          Maintainer: Local Build <noreply@example.invalid>
          Depends: phpapi-20220829, libgeos-c1v5 (>= 3.6.0)
          Description: Isolated PHP 8.2 GEOS extension for Debian 12
           Separate installation under /opt/mjh/php-geos-8.2.
           Does not replace php-geos, change PHP configuration or run maintainer scripts.
          CONTROL
          dpkg-deb -b "$pkgroot" "$GITHUB_WORKSPACE/output/mjh-php82-geos_1.0.0-8+bookworm1_amd64.deb"
          dpkg-deb -I "$GITHUB_WORKSPACE"/output/*.deb
          dpkg-deb -c "$GITHUB_WORKSPACE"/output/*.deb
          test "$(find "$pkgroot" -type f | wc -l)" -eq 2
          test ! -e "$pkgroot/DEBIAN/postinst"
          test ! -e "$pkgroot/DEBIAN/prerm"
      - name: Test coexistence with Debian php-geos and smoke test the isolated module
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends php-geos
          test -f /etc/php/8.2/mods-available/geos.ini
          oldsum=$(sha256sum /usr/lib/php/20220829/geos.so | cut -d' ' -f1)
          dpkg -i "$GITHUB_WORKSPACE"/output/*.deb
          test "$(sha256sum /usr/lib/php/20220829/geos.so | cut -d' ' -f1)" = "$oldsum"
          dpkg-query -W -f='${Version}' php-geos | grep '^1.0.0-7'
          php8.2 -n -d extension=/opt/mjh/php-geos-8.2/geos.so -r 'if (!extension_loaded("geos") || !class_exists("GEOSGeometry")) exit(1); $r=new GEOSWKTReader(); $g=$r->read("POINT (7 49)"); if (!$g instanceof GEOSGeometry) exit(1); echo "Isolated PHP 8.2 GEOS and WKT reader OK",PHP_EOL;'
          test ! -e /etc/php/8.2/mods-available/mjh-geos.ini
          echo "Existing Debian php-geos package remains installed and unchanged."

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: mjh-php82-geos-isolated
          path: output/*.deb
          if-no-files-found: error
          retention-days: 14
